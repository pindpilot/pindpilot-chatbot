<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1115"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="PindPilot AI"><meta name="description" content="Your ideas, in conversation. A private-feeling AI chat workspace."><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><link rel="icon" href="./icon-192.png"><title>PindPilot AI · Your space to think</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{font-family:'DM Sans',system-ui,sans-serif;color-scheme:dark;--bg:#0b1115;--pane:#111b20;--elev:#19262b;--line:#2a393c;--text:#f1f3ee;--muted:#9daea9;--green:#a9e7bc;--deep:#143a2d;--shadow:0 30px 80px #0005}body.light{color-scheme:light;--bg:#f5f7f1;--pane:#ffffff;--elev:#eaf1e9;--line:#d6e3d8;--text:#182720;--muted:#60756b;--green:#2c704b;--deep:#deefe1;--shadow:0 22px 60px #2c49301b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100dvh}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}.app{display:flex;height:100dvh;overflow:hidden}.sidebar{width:300px;flex:none;background:var(--pane);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:26px 16px 18px;z-index:5}.brand{display:flex;align-items:center;gap:12px;padding:0 10px 27px}.logo{width:39px;height:39px;background:var(--green);color:#10271c;border-radius:13px;display:grid;place-items:center;font-family:Manrope,sans-serif;font-weight:800;font-size:25px;box-shadow:0 6px 24px #7ecb9440}.brand strong{font:800 17px Manrope}.brand small{display:block;color:var(--muted);font:500 10px Manrope;letter-spacing:.19em;text-transform:uppercase;margin-top:3px}.new{display:flex;align-items:center;gap:10px;padding:13px 16px;border:1px solid var(--line);border-radius:13px;background:var(--elev);color:var(--text);font-weight:700;width:100%;text-align:left}.new span{margin-left:auto;font-size:20px;color:var(--green)}.sectionlabel{color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.17em;text-transform:uppercase;margin:31px 12px 11px}.history{overflow:auto;flex:1;min-height:0}.historyitem{width:100%;display:flex;align-items:center;border-radius:11px;margin:3px 0}.historyitem.active{background:var(--elev)}.historyitem>button:first-child{flex:1;min-width:0;padding:12px;color:var(--text);background:none;border:0;text-align:left;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;font-size:13px}.historyitem .del{background:none;color:var(--muted);border:0;padding:9px 12px}.historyitem .del:hover{color:#f5aaa1}.sidefoot{border-top:1px solid var(--line);padding:17px 8px 0;color:var(--muted);font-size:11px;line-height:1.55}.sidefoot b{color:var(--green)}.main{display:flex;flex-direction:column;min-width:0;flex:1;background:radial-gradient(ellipse at 55% -35%,#1b3933 0,transparent 45%),var(--bg)}body.light .main{background:radial-gradient(ellipse at 55% -35%,#dbefe2 0,transparent 47%),var(--bg)}.top{height:76px;min-height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;gap:10px}.lefttop,.righttop{display:flex;align-items:center;gap:13px}.mobilemenu{display:none}.title{font:700 14px Manrope;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.model{font-size:11px;color:var(--green);border:1px solid var(--line);background:var(--pane);padding:9px 12px;border-radius:999px;white-space:nowrap}.model i,.status i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px}.iconbtn{border:1px solid var(--line);background:var(--pane);color:var(--text);border-radius:11px;min-width:36px;height:36px}.messages{overflow:auto;flex:1;min-height:0;scroll-behavior:smooth}.conversation{max-width:810px;margin:0 auto;padding:38px 32px 18px}.welcome{max-width:760px;margin:min(13vh,120px) auto 0;padding:0 32px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--green);font-weight:800}.welcome h1{font:800 clamp(35px,5.1vw,58px)/1.12 Manrope,sans-serif;letter-spacing:-.055em;margin:17px 0 17px}.welcome h1 em{font-style:normal;color:var(--green)}.welcome p{color:var(--muted);font-size:16px;line-height:1.65;max-width:560px}.suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:43px}.suggestions button{text-align:left;color:var(--text);background:var(--pane);border:1px solid var(--line);border-radius:15px;padding:17px;line-height:1.5;transition:transform .15s,border .15s}.suggestions button:hover{transform:translateY(-2px);border-color:var(--green)}.suggestions b{display:block;font-size:13px}.suggestions span{display:block;font-size:11px;color:var(--muted);margin-top:6px}.message{margin:0 0 32px;display:flex;gap:14px;align-items:flex-start}.avatar{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;font:800 14px Manrope}.assistant .avatar{background:var(--green);color:#11291d}.user .avatar{background:var(--elev);color:var(--text)}.bubble{min-width:0;flex:1;font-size:14px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;padding:2px 0}.user .bubble{font-weight:600}.actions{margin-top:10px;display:flex;gap:6px}.actions button{font-size:11px;padding:5px 9px;border:1px solid var(--line);background:none;color:var(--muted);border-radius:7px}.actions button:hover{color:var(--green)}.dots{display:flex;gap:5px;padding:12px 0}.dots i{width:6px;height:6px;border-radius:50%;background:var(--green);animation:bounce 1.2s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes bounce{0%,70%,100%{transform:translateY(0);opacity:.4}35%{transform:translateY(-5px);opacity:1}}.composerarea{padding:12px 32px max(18px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 24%)}.composerwrap{max-width:810px;margin:auto}.error{color:#f5aaa1;font-size:12px;padding:0 4px 9px;line-height:1.5}.composer{border:1px solid var(--line);background:var(--pane);border-radius:19px;padding:12px 12px 10px 18px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-end}.composer:focus-within{border-color:var(--green)}textarea{border:0;outline:0!important;background:transparent;color:var(--text);resize:none;width:100%;min-height:31px;max-height:145px;line-height:1.55;font-size:14px;padding:5px 0}textarea::placeholder{color:var(--muted)}.send{background:var(--green);border:0;color:#10271c;border-radius:11px;width:37px;height:37px;flex:none;font-size:21px;font-weight:800}.hint{text-align:center;color:var(--muted);font-size:10px;margin:11px 0 0}.overlay{display:none}
@media(max-width:740px){.sidebar{position:absolute;inset:0 auto 0 0;height:100dvh;transform:translateX(-102%);transition:transform .22s;width:min(300px,82vw);box-shadow:var(--shadow)}.sidebar.open{transform:none}.overlay.open{display:block;position:fixed;inset:0;background:#0008;z-index:4}.mobilemenu{display:block}.top{height:62px;min-height:62px;padding:0 17px}.model{font-size:10px;padding:7px 9px}.conversation{padding:27px 20px}.welcome{margin:min(11vh,100px) auto 0;padding:0 24px}.welcome h1{font-size:37px}.welcome p{font-size:14px}.suggestions{margin-top:32px}.suggestions button{padding:14px}.composerarea{padding:10px 16px max(12px,env(safe-area-inset-bottom))}.hint{font-size:9px}.title{max-width:125px}}@media(max-width:360px){.suggestions{grid-template-columns:1fr}.model{display:none}}
</style></head><body><div class="app"><div class="overlay" id="overlay"></div><aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">P</div><div><strong>PindPilot AI</strong><small>YOUR THINKING SPACE</small></div></div><button class="new" id="newChat">＋ &nbsp; New chat <span>↗</span></button><div class="sectionlabel">Recent conversations</div><div class="history" id="history"></div><div class="sidefoot"><b>● &nbsp; Phase 1 · Early access</b><br>Chats stay on this device. Avoid sharing sensitive details. Voice, photos and web search are coming later.</div></aside><main class="main"><header class="top"><div class="lefttop"><button class="iconbtn mobilemenu" id="menu" aria-label="Open conversations">☰</button><span class="title" id="chatTitle">New conversation</span></div><div class="righttop"><span class="model"><i></i>Gemini · Flash</span><button class="iconbtn" id="theme" title="Toggle light and dark mode" aria-label="Toggle light and dark mode">☼</button></div></header><section class="messages" id="messages" aria-live="polite"></section><div class="composerarea"><div class="composerwrap"><div class="error" id="error" role="alert" hidden></div><form class="composer" id="form"><textarea id="prompt" rows="1" maxlength="8000" aria-label="Your message" placeholder="Ask me anything…"></textarea><button class="send" id="send" type="submit" aria-label="Send message">↑</button></form><div class="hint">Made for curious minds · English, हिन्दी, ਪੰਜਾਬੀ and Roman Punjabi</div></div></div></main></div><script>
'use strict';
const API_ENDPOINT='__API_ENDPOINT__'; // replaced only with a public proxy URL, never a secret
const $=id=>document.getElementById(id),KEY='pindpilot-chat-v1';let chats=[],active=null,busy=false;
function persist(){try{localStorage.setItem(KEY,JSON.stringify({chats,active}))}catch(e){showError('Storage is full or unavailable. Older chats may not save on this device.')}}
try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');chats=Array.isArray(saved.chats)?saved.chats.filter(c=>c&&typeof c.id==='string'&&Array.isArray(c.messages)).slice(0,100):[];active=chats.some(c=>c.id===saved.active)?saved.active:null}catch(e){}
const current=()=>chats.find(c=>c.id===active);function showError(s){$('error').textContent=s;$('error').hidden=!s}function closeMenu(){$('sidebar').classList.remove('open');$('overlay').classList.remove('open')}function newChat(){if(busy)return;active=null;showError('');render();closeMenu();$('prompt').focus()}function choose(id){if(busy)return;active=id;persist();showError('');render();closeMenu()}
function create(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}function renderHistory(){const root=$('history');root.replaceChildren();for(const c of chats){const row=create('div','historyitem'+(c.id===active?' active':''));const open=create('button','',c.title||'New conversation');open.title=c.title||'New conversation';open.onclick=()=>choose(c.id);const del=create('button','del','×');del.title='Delete conversation';del.setAttribute('aria-label','Delete '+(c.title||'conversation'));del.onclick=()=>{if(busy)return;if(!confirm('Delete this conversation from this device?'))return;chats=chats.filter(x=>x.id!==c.id);if(active===c.id)active=null;persist();render()};row.append(open,del);root.append(row)}if(!chats.length)root.append(create('div','sectionlabel','No chats yet'))}
function welcome(root){const el=create('div','welcome');el.innerHTML='<div class="eyebrow">A SPACE FOR EVERY IDEA</div><h1>What’s on your <em>mind?</em></h1><p>Ask a question, think something through, or start with a small idea. Your AI companion is ready when you are.</p>';const cards=create('div','suggestions');[['Write something','Help me draft a clear message'],['Learn anything','Explain a difficult topic simply'],['Brainstorm ideas','Help me come up with three creative ideas'],['Punjabi vich gall','Mere naal Roman Punjabi vich gall karo']].forEach(([a,b])=>{const btn=create('button');btn.innerHTML='<b></b><span></span>';btn.querySelector('b').textContent=a;btn.querySelector('span').textContent=b;btn.onclick=()=>{$('prompt').value=b;resize();$('prompt').focus()};cards.append(btn)});el.append(cards);root.append(el)}
function render(){renderHistory();const c=current(),root=$('messages');root.replaceChildren();$('chatTitle').textContent=c?.title||'New conversation';if(!c?.messages.length)welcome(root);else{const box=create('div','conversation');c.messages.forEach(m=>{if(!m||typeof m.text!=='string'||!['user','assistant'].includes(m.role))return;const row=create('article','message '+m.role);row.append(create('div','avatar',m.role==='user'?'Y':'P'));const contents=create('div');contents.append(create('div','bubble',m.text));if(m.role==='assistant'){const actions=create('div','actions');const copy=create('button','','Copy');copy.onclick=async()=>{try{await navigator.clipboard.writeText(m.text);copy.textContent='Copied'}catch{showError('Copy is unavailable here. Select the answer to copy it.')}};const share=create('button','','Share');share.onclick=async()=>{try{if(navigator.share)await navigator.share({text:m.text});else{await navigator.clipboard.writeText(m.text);share.textContent='Copied to share'}}catch(e){if(e.name!=='AbortError')showError('Share is unavailable on this device.')}};actions.append(copy,share);contents.append(actions)}row.append(contents);box.append(row)});if(busy){const row=create('article','message assistant');row.append(create('div','avatar','P'));const dots=create('div','dots');dots.setAttribute('aria-label','AI is thinking');dots.innerHTML='<i></i><i></i><i></i>';row.append(dots);box.append(row)}root.append(box)}requestAnimationFrame(()=>root.scrollTop=root.scrollHeight)}
function resize(){const t=$('prompt');t.style.height='auto';t.style.height=Math.min(145,t.scrollHeight)+'px'}
$('prompt').addEventListener('input',resize);$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}});
$('form').addEventListener('submit',async e=>{e.preventDefault();const text=$('prompt').value.trim();if(!text||busy)return;showError('');if(API_ENDPOINT.startsWith('__')){showError('AI chat is not connected yet. Your message was not sent.');return}let c=current();if(!c){c={id:crypto.randomUUID(),title:text.slice(0,44),messages:[],at:Date.now()};chats.unshift(c);active=c.id}c.messages.push({role:'user',text});c.at=Date.now();chats.sort((a,b)=>b.at-a.at);$('prompt').value='';resize();busy=true;$('send').disabled=true;persist();render();const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);try{const history=c.messages.slice(-16).map(m=>({role:m.role==='assistant'?'model':'user',text:m.text}));const response=await fetch(API_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history}),signal:controller.signal});let data;try{data=await response.json()}catch{throw Error('The AI service returned an invalid response.')}if(!response.ok)throw Error(data.error||'AI is unavailable right now.');if(typeof data.text!=='string'||!data.text.trim())throw Error('AI returned an empty answer. Please try again.');c.messages.push({role:'assistant',text:data.text.trim()});persist()}catch(err){showError(err.name==='AbortError'?'The request timed out. Please try again.':String(err.message||'Something went wrong.'));}finally{clearTimeout(timer);busy=false;$('send').disabled=false;render();$('prompt').focus()}});
$('newChat').onclick=newChat;$('menu').onclick=()=>{$('sidebar').classList.add('open');$('overlay').classList.add('open')};$('overlay').onclick=closeMenu;
let theme=localStorage.getItem('pindpilot-theme')||'dark';function applyTheme(){document.body.classList.toggle('light',theme==='light');$('theme').textContent=theme==='light'?'☾':'☼';document.querySelector('meta[name="theme-color"]').content=theme==='light'?'#f5f7f1':'#0b1115'}$('theme').onclick=()=>{theme=theme==='dark'?'light':'dark';localStorage.setItem('pindpilot-theme',theme);applyTheme()};applyTheme();render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
